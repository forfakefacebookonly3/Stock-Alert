name: check

on:
  schedule:
    # นาทีที่ 7/22/37/52 แทน :00/:15/:30/:45 — GitHub มักเลื่อนหรือข้ามรอบที่ตรงต้นชั่วโมงเพราะคิวแน่น
    # ตลาดไทย: 10:00–16:59 น. เวลาไทย
    - cron: "7,22,37,52 3-9 * * 1-5"
    # ตลาดสหรัฐ: 20:00–04:59 น. เวลาไทย (ครอบทั้งเวลาออมแสงและเวลาปกติ)
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      diag:
        description: "ตรวจระบบ: ดึงราคาทุกตัว + ส่ง noti ทดสอบ (ไม่แก้ข้อมูล)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diagnose
        if: ${{ inputs.diag }}
        env:
          DATA_FILE: data/alerts.json
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python -m checker.diag

      - name: Check alerts
        if: ${{ !inputs.diag }}
        env:
          DATA_FILE: data/alerts.json
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python -m checker.check

      - name: Commit data
        working-directory: data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts.json
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลง"
          else
            git commit -m "data: checker update"
            git pull --rebase origin data
            git push origin HEAD:data
          fi
